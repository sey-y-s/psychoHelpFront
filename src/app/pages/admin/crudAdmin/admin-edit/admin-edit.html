<div class="page">

  <div class="container">

    <h2>Modifier un administrateur</h2>

    <form [formGroup]="adminForm" (ngSubmit)="modifierAdmin()">

      <div class="form-group">
        <label>Nom</label>
        <input
          type="text"
          formControlName="nom"
          placeholder="Nom">
      </div>

      <div class="form-group">
        <label>Prénom</label>
        <input
          type="text"
          formControlName="prenom"
          placeholder="Prénom">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          formControlName="mail"
          placeholder="Adresse email">
      </div>

      <div class="form-group">
        <label>Téléphone</label>
        <input
          type="text"
          formControlName="telephone"
          placeholder="Numéro de téléphone">
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <input
          type="password"
          formControlName="motDePasse"
          placeholder="Nouveau mot de passe">
      </div>

      <div class="actions">
        <button class="btn-modifier" type="submit">
          Modifier
        </button>

        <button
          class="btn-annuler"
          type="button"
          (click)="redirectList()">
          Annuler
        </button>
      </div>

    </form>

  </div>

</div>
