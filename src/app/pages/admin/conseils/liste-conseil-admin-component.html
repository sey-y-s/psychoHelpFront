<h2>Liste des conseils</h2>
<div class="container-fluid d-flex flex-column vh-100">
    <div class="row ligne-filter mt-5">
        <p class="d-inline-flex align-items-center justify-content-around col-10 offset-1 mt-2">
            <button id="btn-en-attente"
                    class="btn btn-outline-info btn-filter"
                    [class.active]="filtreActif==='attente'"
                    (click)="changerFiltre('attente')">En attente</button>
            <button id="btn-valider"
                    class="btn-filter" [class.active]="filtreActif==='valider'"
                    (click)="changerFiltre('valider')">Validés</button>
            <button  class="btn btn-outline-secondary btn-filter"
                     [class.active]="filtreActif==='refuser'"
                     [class.active]="filtreActif==='refuser'"
                     (click)="changerFiltre('refuser')">Refusés</button>
            <button id="btn-tous" class="btn-filter"
                    [class.active]="filtreActif==='tous'"
                    (click)="changerFiltre('tous')">Tous les conseils</button>
        </p>
    </div>

    <div *ngIf="isLoading" class="d-flex justify-content-center align-items-center mt-5" style="min-height: 150px;">
        <div class="spinner-grow text-info" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div *ngIf="!isLoading" class="list-card flex-grow-1 overflow-auto mt-3">
        <app-card-validation-conseil
                *ngFor="let conseil of listConseils" [donnees]="conseil"
                [routerLink]="['/admin/conseils', conseil.id]"
                style="cursor: pointer; display: block;"
        ></app-card-validation-conseil>

        <p *ngIf="listConseils.length === 0" class="text-center text-muted mt-4">
            Aucun conseil trouvé.
        </p>
    </div>
</div>
