<div class="modal-overlay" >

    <section class="modale" >

        <header class="modal-header">
            <div>
                <h2>
                                             Modification d'une question
                </h2>

                <p>Renseignez tous les  champs.</p>
            </div>

            
        </header>

        <form [formGroup]="form" (ngSubmit)="soumission()" >

            <div class="form-group">
                <label for="jour">Titre</label>
                <input type="text" formControlName="question"  >
                @if(form.get("question")?.invalid&&form.get("question")?.touched){
                   <small class="invalid-feedbacks"> titre est requis</small>

                }
            </div>
            <div class="form-group">
                 <label for="test">Test</label>
                <select name="" id="test" formControlName="test_id">
                       @for (test of test(); track test.id) {
                          <option [value]="test.id">{{test.nom_test}}</option>
                       }
                </select>
            </div>
            <footer class="form-actions">

                <button  (click)="annuler()"
                        type="button"
                        class="cancel"
                >
                    Annuler
                </button>

                <button
                        type="submit"
                        class="save"
                        
                >
                modifier
                </button>

            </footer>

        </form>

    </section>

</div>
