<div class="header-list">
  <h2>Liste des tests</h2>

  <button mat-raised-button color="primary" (click)="ajouter()">
    <mat-icon>add</mat-icon>
    Ajouter un test
  </button>
</div>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Nom test</th>
      <th>Description</th>
      <th>État</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody>
    @for(test of testCitoyen; track test.id) {

    <tr>
      <td>{{ test.id }}</td>

      <td>{{ test.nom_test }}</td>

      <td class="description">{{ test.description }}</td>

      <td>{{test.etat}}</td>

      <td class="actions">
        <button
          mat-icon-button
          title="Visualiser"
          (click)="visualiser(test.id)"
        >
          <mat-icon class="view-icon">visibility</mat-icon>
        </button>
        <button mat-icon-button title="Modifier" (click)="modifier(test)">
          <mat-icon class="edit-icon">edit</mat-icon>
        </button>
        <button
          mat-icon-button
          title="Supprimer"
          (click)="supprimerTest(test.id)"
        >
          <mat-icon class="delete-icon">delete</mat-icon>
        </button>
      </td>
    </tr>

    }
  </tbody>
</table>
