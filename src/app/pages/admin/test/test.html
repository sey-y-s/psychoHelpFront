<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PsychoHelp - Catégorie de tests</title>
</head>

<body>
  <main class="main-content">
    <h1 class="page-title">Catégorie de tests</h1>

    <div class="cards-grid">
      @for (category of listCategorie; track category.id; let i = $index) {
      <div class="card" routerLink="{{category.id}}">
        <div class="card-image-container">
          <!--{{category.description}}-->
          <img  [src]="(i + 1) + '.png'" [alt]="category.nomCategorie">
        </div>
        <h6>{{ category.nomCategorie }}</h6>
      </div>
      } @empty {
        <!-- Message optionnel si la liste est vide -->
        <p>Aucune catégorie disponible pour le moment.</p>
        }
    </div>

    <div class="add-button-container">
      <button class="btn-add" routerLink="/admin/tests/ajout">
        <i class="fa-solid fa-circle-plus"></i> Ajouter
      </button>
    </div>
    
  </main>
</body>

</html>
