
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PsychoHelp - Catégorie de tests</title>

</head>
<body>

<main class="main-content">
    <h1 class="page-title">Catégorie de tests</h1>


    <div class="cards-grid">
        <div class="card">
            <div class="card-image-placeholder">
                <img src="anxiete.png" alt="anxiete">
            </div>
            <span class="card-title">Anxiété</span>
        </div>

        <div class="card">
            <div class="card-image-placeholder">
                <img src="depression.png" alt="anxiete" id="depression">
            </div>
            <span class="card-title">Dépression</span>
        </div>

        <div class="card">
            <div class="card-image-placeholder">
                <img src="stress.png" alt="anxiete">
            </div>
            <span class="card-title">Stress</span>
        </div>

        <div class="card">
            <div class="card-image-placeholder">
                <img src="humeur.png" alt="anxiete">
            </div>
            <span class="card-title">Humeur</span>
        </div>


    </div>

    <div class="add-button-container">
        <a class="btn-add" routerLink="/admin/tests/ajout">
            <i class="fa-solid fa-circle-plus"></i> Ajouter
        </a>
    </div>
</main>

</body>
</html>
