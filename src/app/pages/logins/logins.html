<div class="page-login">


  <!-- En-tête de la page -->
  <header class="header">

    <div class="logo">
      <img src="assets/logo.png" alt="Logo PsychoHelp">
    </div>

    <button class="btn-top">
      S'inscrire ou se connecter
    </button>

  </header>



  <!-- Contenu principal -->
  <main>


    <!-- Titre de la page -->
    <section class="title">

      <h1>Se connecter</h1>

      <p>
        Accueil > Se connecter
      </p>

    </section>




    <!-- Section connexion et inscription -->
    <section class="container">


      <!-- Carte connexion -->
      <article class="card">


        <h2>
          Se connecter 📱
        </h2>


        <p>
          Indiquez votre adresse email et mot de passe.
        </p>



        <form 
          [formGroup]="forms" 
          (ngSubmit)="login()"
        >


          <input 
            type="email"
            placeholder="Adresse email"
            formControlName="email"
          >



          <input 
            type="password"
            placeholder="Mot de passe"
            formControlName="motDePasse"
          >



          @if(isLoading){

            <mat-progress-bar mode="query"></mat-progress-bar>

          }
          @else {

            <button 
              type="submit"
              class="btn-login"
            >
              Se connecter
            </button>

          }


        </form>


      </article>





      <!-- Carte inscription -->
      <article class="card inscription">


        <h2>
          S'inscrire 📱
        </h2>




        <section class="bloc">


          <h3>
            Vous êtes citoyen(ne) ?
          </h3>


          <p>
            Commencez votre thérapie dès aujourd'hui.
          </p>


          <button>
            S'inscrire
          </button>


        </section>





        <hr>





        <section class="bloc">


          <h3>
            Vous êtes psychologues ?
          </h3>


          <p>
            Rejoignez la plateforme et développez votre activité.
          </p>


          <button>
            S'inscrire
          </button>


        </section>



      </article>



    </section>



  </main>


</div>
