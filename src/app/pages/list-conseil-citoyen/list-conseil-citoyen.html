<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
<div class="cards-container">

  @for (element of conseils; track element.id) {

    <div class="card">

      <h3>{{ element.titre }}</h3>

      <p>
        <strong>Auteur :</strong> {{ element.auteur }}
      </p>

      <p>
<strong>Date :</strong> {{ element.datePublication }}

      </p>

      <p>
        {{ element.description | slice:0:100 }}...
      </p>

      <button (click)="show(element)">
        Voir plus
      </button>

    </div>

  }

</div>
  
</body>
</html>
