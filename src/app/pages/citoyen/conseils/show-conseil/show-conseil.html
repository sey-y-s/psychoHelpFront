<div class="page-container">

  @if (conseil) {

    <div class="detail-card">

      <h2>{{ conseil.titre }}</h2>

      <p><strong>Auteur :</strong> {{ conseil.auteur ? conseil.auteur : conseil.psyNom }}</p>

      <p><strong>Date :</strong> {{ conseil.datePublication }}</p>

      <p><strong>Description :</strong></p>

      <p>{{ conseil.description }}</p>

    </div>

  } @else {

    <h2>Conseil introuvable</h2>

  }

</div>

<div class="retour">
  <button routerLink="/me/conseils">
    <!-- <mat-icon>medical_services</mat-icon> -->
    <span>Retour</span>
  </button>
</div>
