<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>

    
  <input
  class="inputRecherche"
    matInput
    [(ngModel)]="rechercherText"
    placeholder="Rechercher un conseil..." />


   
<div class="cards-container">

  @if (filtrageConseil.length > 0) {

    @for (element of filtrageConseil; track element.id ) {

      <div class="card">

        <h3>{{ element.titre }}</h3>

        <p><strong>Auteur :</strong> {{ element.auteur }}</p>

        <p><strong>Date :</strong> {{ element.datePublication }}</p>

        <p>{{ element.description | slice:0:50 }}...</p>

        <button (click)="show(element)">
          Voir plus
        </button>

      </div>

    }

  } @else {

    <h1>Aucun conseil trouvé</h1>

  }

</div>

  
</body>
</html>
