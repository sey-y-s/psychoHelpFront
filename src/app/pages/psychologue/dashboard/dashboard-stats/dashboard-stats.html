<section class="stats-grid">
    <a class="stat-card"
            routerLink="/psy/rendez-vous">
        <div class="stat-header">
            <div class="stat-icon rendez-vous">
                <mat-icon>calendar_month</mat-icon>
            </div>
            <strong>{{ dashboard.rendezVousAVenir }}</strong>
        </div>
        <span>Rendez-vous</span>
        <small class="purple">À venir</small>
    </a>

    <a class="stat-card" routerLink="/psy/creneaux">
        <div class="stat-header">
            <div class="stat-icon creneaux">
                <mat-icon>schedule</mat-icon>
            </div>
            <strong>{{ dashboard.creneauxDisponibles }}</strong>
        </div>
        <span>Créneaux</span>
        <small class="green">Disponibles</small>
    </a>

    <a class="stat-card" routerLink="/psy/conseils">
        <div class="stat-header">
            <div class="stat-icon conseils">
                <mat-icon>notes</mat-icon>
            </div>
            <strong>{{ dashboard.conseilsPublies }}</strong>
        </div>
        <span>Conseils</span>
        <small class="orange">Publiés</small>
    </a>

    <a class="stat-card" routerLink="/psy/notifications">
        <div class="stat-header">
            <div class="stat-icon notifications">
                <mat-icon>notifications_none</mat-icon>
            </div>
            <strong>{{ dashboard.notificationsNonLues }}</strong>
        </div>
        <span>Notifications</span>
        <small class="red">Non lues</small>
    </a>
</section>
