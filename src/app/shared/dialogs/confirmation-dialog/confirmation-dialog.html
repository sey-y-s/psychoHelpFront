<h2 mat-dialog-title>
    {{ data.titre }}</h2>
<mat-dialog-content>
    <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button (click)="annuler()">
        Annuler
    </button>

    <button mat-raised-button color="primary" (click)="confirmer()">
        {{ data.bouton || 'Confirmer' }}
    </button>
</mat-dialog-actions>
